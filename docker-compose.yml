services:
  db:
    image: postgres:16-alpine
    container_name: runningclub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runningclub
    ports:
      # 5432 is taken by campus-app-db; use 5434 for the local running-club DB.
      - '5434:5432'
    volumes:
      - runningclub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d runningclub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  runningclub_pgdata:
